-<!DOCTYPE html>
<html>

<head>

<title>Kayak GPS Tracker</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" 
href="https://unpkg.com/leaflet/dist/leaflet.css" />

<style>

body {
    font-family: Arial;
    text-align:center;
    margin:0;
}

h1 {
    margin:10px;
}

button {
    font-size:18px;
    padding:10px 15px;
    margin:5px;
}

.box {
    font-size:20px;
    margin:8px;
}

#map {
    height:55vh;
    width:100%;
}

#history {
    text-align:left;
    padding:10px;
}

.trip {
    border:1px solid #aaa;
    margin:5px;
    padding:8px;
    border-radius:8px;
}

</style>

</head>


<body>


<h1>Kayak GPS</h1>


<button onclick="startTrip()">
Start Trip
</button>


<button onclick="stopTrip()">
Stop Trip
</button>



<div class="box">
Speed:
<span id="speed">0</span> mph
</div>


<div class="box">
Distance:
<span id="distance">0</span> ft
</div>


<div class="box">
Time:
<span id="time">0</span> sec
</div>


<div class="box">
Average:
<span id="average">0</span> mph
</div>


<div class="box">
Max:
<span id="max">0</span> mph
</div>


<div id="map"></div>


<h2>Saved Trips</h2>

<div id="history"></div>



<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<script>


let map =
L.map('map');


L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png'
)
.addTo(map);



let marker;


let track =
L.polyline(
[],
{
color:'blue',
weight:5
}
)
.addTo(map);



let points=[];

let tracking=false;

let lastPoint=null;

let distance=0;

let startTime=null;

let timer=null;

let speedTotal=0;

let speedCount=0;

let maxSpeed=0;



function startTrip(){


points=[];

distance=0;

speedTotal=0;

speedCount=0;

maxSpeed=0;

lastPoint=null;


track.setLatLngs([]);


tracking=true;


startTime=new Date();


timer=setInterval(function(){

let seconds =
Math.floor(
(new Date()-startTime)/1000
);

document.getElementById("time")
.innerHTML=seconds;


},1000);



alert("Trip Started");


}





function stopTrip(){


tracking=false;


clearInterval(timer);



let trip={


date:new Date().toLocaleString(),


distance:distance,


time:
Math.floor(
(new Date()-startTime)/1000
),


average:
speedCount?
speedTotal/speedCount:
0,


max:maxSpeed,


points:points


};



saveTrip(trip);



alert("Trip Saved");



showTrips();


}






navigator.geolocation.watchPosition(


function(position){



let lat =
position.coords.latitude;


let lon =
position.coords.longitude;



let current =
[lat,lon];



if(!marker){


marker =
L.marker(current)
.addTo(map);


map.setView(current,18);


}

else{


marker.setLatLng(current);


}




if(tracking){



if(lastPoint){



let d =
getDistance(

lastPoint[0],
lastPoint[1],
lat,
lon

);



if(d>5){



distance += d;


document.getElementById("distance")
.innerHTML =
distance.toFixed(1);



points.push(
{
lat:lat,
lon:lon,
time:new Date()
}
);



track.setLatLngs(
points.map(p=>[p.lat,p.lon])
);



lastPoint=current;


}



}

else{


lastPoint=current;


points.push(
{
lat:lat,
lon:lon,
time:new Date()
}
);



}



}




let speed =
position.coords.speed;


if(speed && speed>0){

speed *= 2.23694;

}

else{

speed=0;

}



document.getElementById("speed")
.innerHTML =
speed.toFixed(2);



if(tracking){


speedTotal += speed;

speedCount++;


let avg =
speedTotal/speedCount;


document.getElementById("average")
.innerHTML =
avg.toFixed(2);



if(speed>maxSpeed){

maxSpeed=speed;


document.getElementById("max")
.innerHTML =
maxSpeed.toFixed(2);

}


}



},



function(error){

alert(error.message);

},


{

enableHighAccuracy:true,

maximumAge:1000,

timeout:10000

}



);







function getDistance(
lat1,
lon1,
lat2,
lon2
){


let R=6371000;


let dLat =
(lat2-lat1)
*
Math.PI/180;


let dLon =
(lon2-lon1)
*
Math.PI/180;



let a =
Math.sin(dLat/2)**2
+
Math.cos(lat1*Math.PI/180)
*
Math.cos(lat2*Math.PI/180)
*
Math.sin(dLon/2)**2;



let c =
2*Math.atan2(
Math.sqrt(a),
Math.sqrt(1-a)
);



return R*c*3.28084;


}





function saveTrip(trip){


let trips =
JSON.parse(
localStorage.getItem("kayakTrips")
||
"[]"
);



trips.push(trip);



localStorage.setItem(
"kayakTrips",
JSON.stringify(trips)
);



}




function showTrips(){


let trips =
JSON.parse(
localStorage.getItem("kayakTrips")
||
"[]"
);



let html="";



trips.forEach(function(t,i){



html +=
`
<div class="trip">

Trip ${i+1}<br>

${t.date}<br>

Distance:
${t.distance.toFixed(1)} ft<br>

Time:
${t.time} sec<br>

Average:
${t.average.toFixed(2)} mph<br>

Max:
${t.max.toFixed(2)} mph

</div>
`;



});



document.getElementById("history")
.innerHTML=html;



}



showTrips();



</script>


</body>

</html>
