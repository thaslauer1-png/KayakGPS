<!DOCTYPE html>
<html>

<head>

<title>Kayak GPS Tracker</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" 
href="https://unpkg.com/leaflet/dist/leaflet.css" />

<style>

body {
    font-family: Arial;
    text-align: center;
    margin: 0;
}

h1 {
    margin: 10px;
}

.box {
    font-size: 22px;
    margin: 10px;
}

#map {
    height: 65vh;
    width: 100%;
}

button {
    font-size: 18px;
    padding: 10px 20px;
    margin: 5px;
}

</style>

</head>


<body>


<h1>Kayak GPS</h1>


<button onclick="startTracking()">
Start Tracking
</button>


<button onclick="stopTracking()">
Stop Tracking
</button>



<div class="box">
Speed:
<span id="speed">0</span> mph
</div>


<div class="box">
Distance:
<span id="distance">0</span> ft
</div>


<div id="map"></div>



<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<script>


// MAP SETUP

let map = L.map('map');


L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    maxZoom:19
}
).addTo(map);



let marker = null;


let points = [];


let track =
L.polyline(
[],
{
    color:'blue',
    weight:5
}
).addTo(map);



let tracking = false;


let lastPoint = null;


let totalDistance = 0;


let lastGPS = null;



function startTracking(){

tracking = true;

alert("Tracking Started");

}



function stopTracking(){

tracking = false;

alert("Tracking Stopped");

}




navigator.geolocation.watchPosition(


function(position){



let lat =
position.coords.latitude;


let lon =
position.coords.longitude;



let current =
[lat,lon];



// FIRST GPS POINT

if(!marker){

marker =
L.marker(current)
.addTo(map);


map.setView(current,18);

}




else{


marker.setLatLng(current);


}



// ONLY DRAW WHEN TRACKING

if(tracking){



if(lastPoint){



let distance =
getDistance(

lastPoint[0],
lastPoint[1],
lat,
lon

);



// ignore GPS noise

if(distance > 5){



totalDistance += distance;



document.getElementById("distance")
.innerHTML =
totalDistance.toFixed(1);



points.push(current);


track.setLatLngs(points);



lastPoint=current;



}



}



else{


points.push(current);


track.setLatLngs(points);


lastPoint=current;


}



}




// SPEED

let speed =
position.coords.speed;


if(speed && speed > 0){

speed =
speed * 2.23694;

}

else{

speed = 0;

}



document.getElementById("speed")
.innerHTML =
speed.toFixed(2);



lastGPS = position;



},



function(error){

alert(
"GPS Error: "
+
error.message
);

},



{

enableHighAccuracy:true,

maximumAge:1000,

timeout:10000

}



);




// DISTANCE CALCULATION

function getDistance(
lat1,
lon1,
lat2,
lon2
){


let R = 6371000;


let dLat =
(lat2-lat1)
*
Math.PI/180;


let dLon =
(lon2-lon1)
*
Math.PI/180;


let a =
Math.sin(dLat/2)
*
Math.sin(dLat/2)
+
Math.cos(lat1*Math.PI/180)
*
Math.cos(lat2*Math.PI/180)
*
Math.sin(dLon/2)
*
Math.sin(dLon/2);



let c =
2 *
Math.atan2(
Math.sqrt(a),
Math.sqrt(1-a)
);



return R*c*3.28084;


}



</script>


</body>

</html>
