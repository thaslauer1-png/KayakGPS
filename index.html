<!DOCTYPE html>
<html>

<head>

<title>Kayak GPS</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" 
href="https://unpkg.com/leaflet/dist/leaflet.css" />

<style>

body {
    font-family: Arial;
    text-align:center;
}

#map {
    height: 60vh;
    width:100%;
}

.box {
    font-size:22px;
    margin:10px;
}

</style>

</head>


<body>

<h1>Kayak GPS</h1>

<div class="box">
Speed:
<span id="speed">0</span> mph
</div>

<div class="box">
Distance:
<span id="distance">0</span> ft
</div>


<div id="map"></div>


<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<script>


let map =
L.map('map');


L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:19
}
).addTo(map);



let marker;

let track =
L.polyline(
[],
{
color:'blue'
}
).addTo(map);



let points=[];

let totalDistance=0;

let lastPosition=null;



navigator.geolocation.watchPosition(

function(position){


let lat =
position.coords.latitude;

let lon =
position.coords.longitude;


let current =
[lat,lon];



if(!marker){

marker =
L.marker(current)
.addTo(map);

map.setView(current,17);

}
else{

marker.setLatLng(current);

}



points.push(current);

track.setLatLngs(points);



if(lastPosition){


let distance =
getDistance(

lastPosition.coords.latitude,
lastPosition.coords.longitude,
lat,
lon

);


totalDistance += distance;


document.getElementById("distance")
.innerHTML =
totalDistance.toFixed(1);


}



let speed =
position.coords.speed;


if(speed){

speed *= 2.23694;

}


else{

speed=0;

}



document.getElementById("speed")
.innerHTML =
speed.toFixed(2);



lastPosition=position;


},


function(error){

alert(error.message);

},


{

enableHighAccuracy:true

}



);



function getDistance(lat1,lon1,lat2,lon2){

let R=6371000;


let dLat =
(lat2-lat1)*Math.PI/180;


let dLon =
(lon2-lon1)*Math.PI/180;


let a =
Math.sin(dLat/2)**2 +

Math.cos(lat1*Math.PI/180) *

Math.cos(lat2*Math.PI/180) *

Math.sin(dLon/2)**2;


let c =
2*Math.atan2(
Math.sqrt(a),
Math.sqrt(1-a)
);


return R*c*3.28084;

}


</script>


</body>

</html>
