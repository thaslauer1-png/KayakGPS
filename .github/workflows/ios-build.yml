name: Build iOS App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install packages
        run: npm install

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          cd ios/App
          pod init
          pod install

      - name: Build iOS
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $PWD/build/KayakGPS.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO

      - name: Create IPA folder
        run: |
          mkdir -p Payload
          cp -r ios/App/build/KayakGPS.xcarchive/Products/Applications/App.app Payload/

      - name: Package IPA
        run: |
          zip -r KayakGPS.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KayakGPS-IPA
          path: KayakGPS.ipa